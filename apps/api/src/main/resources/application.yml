# IHRMS API configuration. Env vars mirror the archived NestJS API so deployments are
# unchanged. The datasource url/username/password are derived from DATABASE_URL (or
# SPRING_DATASOURCE_*) by DatabaseUrlEnvironmentPostProcessor.
server:
  port: ${PORT:8080}
  # Honour X-Forwarded-* behind the Railway/Vercel proxy so derived absolute URLs (e.g. the
  # db-storage blob URLs) use the real public scheme + host, and audit IPs are the client's.
  forward-headers-strategy: framework

spring:
  application:
    name: ihrms-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    hikari:
      # Boot even if the DB is unreachable; GET /health reports db:"down".
      initialization-fail-timeout: -1
      connection-timeout: 3000
  # Flyway owns the schema; Hibernate only VALIDATES its entities against it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # Use the literal @Column/@Table names (no camelCase->snake_case); the existing
        # schema is quoted camelCase, so combined with globally_quoted_identifiers below
        # the identifiers match exactly (e.g. "decidedAt", "companyId").
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      # Preserve the existing quoted camelCase identifiers (companyId, "read", ...).
      hibernate.globally_quoted_identifiers: true
      # Instant <-> timestamp(3) WITHOUT time zone, stored as UTC (like Prisma).
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  # Route unmatched paths through the @RestControllerAdvice (consistent error envelope).
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  # Bound audit-explorer pagination so a client cannot request an unbounded page.
  data:
    web:
      pageable:
        default-page-size: 25
        max-page-size: 100
  # Outbound SMTP for the auto-configured JavaMailSender (§Outbound email). All from SMTP_* env; blank host
  # in dev/tests => JavaMailSender unused (DevLogMailer selected). 587/STARTTLS by default; 465 => SMTP_SSL=true.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The /health probe must not dial the SMTP server (would flap on any mail hiccup and slow readiness);
    # outbound-mail health is handled by the best-effort send path, not the health endpoint (§Outbound email).
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Application config bound to AppProperties (sourced from env; placeholders for later phases).
app:
  cors-origins: ${CORS_ORIGINS:}
  web-app-url: ${WEB_APP_URL:http://localhost:3001}
  # Dev defaults are long enough for HS256 (>=32 bytes); production MUST override with real secrets.
  jwt-secret: ${JWT_SECRET:dev-insecure-access-secret-change-me-please-0001}
  refresh-secret: ${REFRESH_SECRET:dev-insecure-refresh-secret-change-me-please-0001}
  access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
  refresh-cookie-name: ${REFRESH_COOKIE_NAME:ihrms_refresh}
  otp-ttl: ${OTP_TTL:300}
  # Long-open-break HR alert (§8a): notify HR when a break stays OPEN longer than this many minutes; the scan
  # runs every break-alert-scan-ms. Single-instance job (multi-instance would need a shared lock).
  break-alert-minutes: ${BREAK_ALERT_MINUTES:35}
  break-alert-scan-ms: ${BREAK_ALERT_SCAN_MS:300000}
  # eSSL/ZKTeco ADMS ("iClock" push) ingestion — Phase 0. Bound to IclockProperties.
  # enabled gates PERSISTENCE ONLY: the /iclock handlers and the capture filter always register, so the
  # namespace always answers text/plain and never leaks a JSON 404 to a device. Default FALSE — the module
  # is inert on the public deployment until an operator sets ICLOCK_ENABLED=true on the LAN box that the
  # terminal can actually reach over plain HTTP. NOTE: the V41 tables are created by Flyway regardless of
  # this flag (Flyway and @Entity scanning are both unconditional).
  iclock:
    enabled: ${ICLOCK_ENABLED:false}
    # Hard ceiling on the bytes read from a device push. There is no server-wide request-size limit in
    # this app, and /iclock is the only unauthenticated write path, so this is the DoS bound. Bodies over
    # the cap are stored truncated and flagged.
    max-body-bytes: ${ICLOCK_MAX_BODY_BYTES:262144}
    # Generous per-IP ceiling, ~10x above any real terminal's poll rate, so a device is never throttled.
    # Over-limit requests still get text/plain "OK" (never the app-wide JSON 429) but persist nothing.
    rate-limit-per-minute: ${ICLOCK_RATE_LIMIT_PER_MINUTE:600}
    # ATTLOG acknowledgement shape: "count" -> "OK: <n>" (per spec), "plain" -> bare "OK". Switchable
    # because firmware differs on which it accepts; confirm against a real capture before changing.
    ack-format: ${ICLOCK_ACK_FORMAT:count}
    # Capture verbosity. 'full' (default) stores every request body verbatim — required while the
    # firmware dialect is still being learned. 'lean' drops the stored body for MAPPED command polls
    # only (everything else stays full); flip it after live push is verified. Caveat: a poll body is
    # already empty, so lean saves little on its own — row RETENTION is the real volume lever.
    capture-mode: ${ICLOCK_CAPTURE_MODE:full}
    # P3 — THE DEVICE COMMAND CHANNEL. The only flag here that gates a WRITE TO HARDWARE, so it is
    # off unless somebody turns it on. With it false the queue may fill but nothing is ever served,
    # which makes "do nothing" the safe state. Turn it on only for a supervised canary.
    commands-enabled: ${ICLOCK_COMMANDS_ENABLED:false}
    # Most PENDING commands one terminal may hold before another is refused. The bound must clear the
    # largest LEGITIMATE batch: a building-wide name sync is one command per person per device, which
    # is 185 for Orion Towers today. 50 was a guess made before the fleet was measured and would have
    # thrown at the 51st row of the first real sync.
    max-pending-commands-per-device: ${ICLOCK_MAX_PENDING_COMMANDS:1000}
    # Serves without an acknowledgement before a command gives up. A device polls ~every 10s, so
    # three attempts is under a minute of trying before the operator is told instead of the fleet
    # being nagged for ever.
    max-command-serves: ${ICLOCK_MAX_COMMAND_SERVES:3}
    # P1a — burst collapse. Repeated taps by the same person on the same device within this window
    # collapse to one effective punch (IN keeps the first, OUT keeps the latest). Must be > 1s to mean
    # anything: V42's content dedupe already collapses byte-identical same-second repeats. 120s is the
    # brief's figure and is NOT yet measured against this hardware — validate before trusting totals.
    burst-window-seconds: ${ICLOCK_BURST_WINDOW_SECONDS:120}
    # Self-announce caps. /iclock is unauthenticated, so an unknown caller can mint device rows by
    # varying ?SN= and raw punches by POSTing distinct lines. Past these caps the request is answered
    # 200 OK text/plain and simply not stored — never a JSON error, never a 503 that would make a real
    # terminal retry forever.
    max-unclaimed-devices: ${ICLOCK_MAX_UNCLAIMED_DEVICES:10}
    unclaimed-serial-punch-cap: ${ICLOCK_UNCLAIMED_SERIAL_PUNCH_CAP:50000}
    # Retention for iclock_request_logs ONLY. Punches are never touched by retention.
    log-retention-days: ${ICLOCK_LOG_RETENTION_DAYS:7}
    null-bodies-after-two-days: ${ICLOCK_NULL_BODIES_AFTER_TWO_DAYS:false}
    # The handshake options block. Every key is config-driven because we do not yet know which ones this
    # firmware honours; Realtime=1 is what enables live push instead of scheduled batch upload.
    options:
      error-delay: ${ICLOCK_ERROR_DELAY:30}
      # Matches the observed poll cadence of the ZAM180 / pushver 2.4.1 firmware.
      delay: ${ICLOCK_DELAY:30}
      # Quoted: the default value contains colons, which a plain YAML scalar would make ambiguous.
      trans-times: "${ICLOCK_TRANS_TIMES:00:00;14:05}"
      trans-interval: ${ICLOCK_TRANS_INTERVAL:1}
      trans-flag: ${ICLOCK_TRANS_FLAG:1111000000}
      # INTEGER OFFSET IN MINUTES — 330 = +05:30 (Asia/Kolkata). Verified on hardware.
      # Do NOT use fractional hours: an earlier "5.5" was truncated to 5 by the firmware, leaving the
      # terminal 30 minutes slow and mis-stamping every punch until it was re-handshaken.
      time-zone: ${ICLOCK_TIME_ZONE:330}
      realtime: ${ICLOCK_REALTIME:1}
      encrypt: ${ICLOCK_ENCRYPT:0}
      # pushver 2.4.1 terminals commonly look for a server version line; blank omits it.
      server-ver: ${ICLOCK_SERVER_VER:2.4.1}
  # AES-256-GCM key for field-level encryption of sensitive PII/financial columns (§6). Any
  # passphrase works (SHA-256 -> 256-bit key); production MUST override with a real secret.
  field-enc-key: ${FIELD_ENC_KEY:dev-insecure-field-enc-key-change-me-please-0001}
  # Outbound email (§Outbound email). SMTP_HOST present => real SMTP (SmtpMailer); absent => dev-log.
  # host/port/username/password mirror spring.mail.* below (both read the SMTP_* env); from/reply-to are
  # the message identity. Example (Zoho): SMTP_HOST=smtp.zoho.in SMTP_PORT=587 SMTP_STARTTLS=true
  #   SMTP_USERNAME=noreply@hrorg.in SMTP_PASSWORD=<app-password>
  #   MAIL_FROM="hrorg.in <noreply@hrorg.in>" MAIL_REPLY_TO=support@hrorg.in   (465 => SMTP_SSL=true)
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:}
    reply-to: ${MAIL_REPLY_TO:}
    # Where public contact-form enquiries are sent (§8d). Reply-To on those is the SUBMITTER, not support@.
    contact-inbox: ${CONTACT_INBOX:info@hrorg.in}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:}
    access-key-id: ${S3_ACCESS_KEY_ID:}
    secret-access-key: ${S3_SECRET_ACCESS_KEY:}
    force-path-style: ${S3_FORCE_PATH_STYLE:false}
  storage:
    # 'db' (default; store bytes in Postgres, no bucket needed) or 's3' (uses the S3_* block above).
    driver: ${STORAGE_DRIVER:db}
    # Absolute base URL of THIS API for db-storage blob links; blank = derive from the request.
    public-base-url: ${STORAGE_PUBLIC_URL:}
    # Max accepted upload size for the db blob endpoint (bytes); matches the 10 MiB request cap.
    max-bytes: ${STORAGE_MAX_BYTES:10485760}
  # Web Push (VAPID) — OS-level notifications (§ Web Push). SECRETS from env, never committed. Blank ->
  # push is simply DISABLED (logged); it never blocks startup. Generate: npx web-push generate-vapid-keys
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}

# One-time field-encryption re-key (§6) — see FieldKeyReencryptor. Enable for a SINGLE deploy AFTER rotating
# FIELD_ENC_KEY to re-encrypt existing sensitive values from the previous key onto the new one, then unset it.
ihrms:
  reencrypt-field-keys: ${REENCRYPT_FIELD_KEYS:false}
  # The previous passphrase used to decrypt existing values; blank = the old committed dev default — the case
  # the prod boot guard caught (FIELD_ENC_KEY unset, so data was written under the dev key).
  reencrypt-from-key: ${REENCRYPT_FROM_KEY:}
  # One-off iClock backfill (P0.1) — see IclockReplayRunner. Re-parses ATTLOG bodies already captured in
  # iclock_request_logs into iclock_raw_punches, for pushes that landed on the catch-all before the .aspx
  # paths were mapped. Idempotent (content-dedupe unique index, V42), so a repeat run is a no-op; enable
  # for a single boot, read the counts it logs, then unset.
  iclock-replay: ${ICLOCK_REPLAY:false}
  # One-off P1a backfill — see IclockBackfillRunner. Derives effective punches from ALL existing raw
  # history. Claim the devices and load the pin mappings FIRST, or every punch is simply declined as
  # DEVICE_UNCLAIMED (harmless and re-runnable, but pointless). Idempotent; enable for ONE boot.
  iclock-backfill: ${ICLOCK_BACKFILL:false}

---
# Local/dev profile: refresh cookie relaxes to insecure + SameSite=Lax (set in auth phase).
spring:
  config:
    activate:
      on-profile: local

---
# Production profile: refresh cookie is Secure + SameSite=None (set in auth phase).
spring:
  config:
    activate:
      on-profile: prod
