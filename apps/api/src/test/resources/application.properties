# Test-only overrides (additive — coexists with the main application.yml; .properties wins on conflicts).
#
# Spring's TestContext framework caches a separate ApplicationContext (and its Hikari pool) for EACH distinct
# test configuration and keeps them all open until the JVM exits. With the default pool (max 10) a dozen
# distinct contexts exhaust a stock Postgres 'max_connections' (~100) — a late context then fails to start
# with "FATAL: sorry, too many clients already". Capping the per-context pool keeps the whole suite well under
# the ceiling regardless of how many contexts accumulate. Tests are synchronous (MockMvc), so a small pool is
# ample.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
